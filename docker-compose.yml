services:
  # ─── Full application stack (team baseline, from main) ─────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-coder:7b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: archlens
      POSTGRES_USER: archlens
      POSTGRES_PASSWORD: archlens_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ─── P1 CV pipeline exploration environment (this branch) ──────────────────
  jupyter:
    build:
      context: .
      dockerfile: backend/Dockerfile.cv-pipeline
    ports:
      - "8888:8888"
    working_dir: /workspace
    volumes:
      - ./backend:/workspace/backend
      - ./data:/workspace/data
      - ./docs:/workspace/docs
      - ./experiments:/workspace/experiments
      - ./notebooks:/workspace/notebooks

  pipeline:
    build:
      context: .
      dockerfile: backend/Dockerfile.cv-pipeline
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
      - ./data:/workspace/data
      - ./docs:/workspace/docs
      - ./experiments:/workspace/experiments
      - ./notebooks:/workspace/notebooks
    command: ["python", "scripts/run_full_pipeline.py"]
    profiles:
      - pipeline

volumes:
  pgdata:
