name: P1 CV Pipeline Tests

"on":
  push:
    branches: [Gokul]
  pull_request:
    branches: [Gokul, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: Run unit tests
        working-directory: backend
        run: python -m pytest tests/unit/ -v

      - name: Lint (ruff) — P1-owned paths only
        working-directory: backend
        run: python -m ruff check --select F,E,W --ignore E501 app/modules/cv_pipeline/ app/schemas/ scripts/ tests/unit/
